<!-- 轻提示 -->
<div class="hidden absolute left-1/2 -translate-x-1/2 bottom-28 z-50 px-4 py-2 rounded-full bg-[#333333]/90 text-white text-[13px] whitespace-nowrap" id="toast"></div>
</div>
<script>
      function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(function () {
          el.classList.add('hidden');
        }, 1600);
      }

      var chart = echarts.init(document.getElementById('chart'));
      chart.setOption({
        title: {
          text: '月度观影数量（部）',
          left: 0,
          top: 0,
          textStyle: { color: '#999999', fontSize: 11, fontWeight: 'normal' }
        },
        grid: { left: 26, right: 8, top: 30, bottom: 20 },
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          valueFormatter: function (value) {
            return value + ' 部';
          }
        },
        xAxis: {
          type: 'category',
          data: ['5月', '6月', '7月', '8月', '9月', '10月'],
          axisLine: { lineStyle: { color: '#EEF0F7' } },
          axisTick: { show: false },
          axisLabel: { color: '#999999', fontSize: 10 }
        },
        yAxis: {
          type: 'value',
          minInterval: 1,
          axisLine: { show: false },
          axisTick: { show: false },
          splitLine: { lineStyle: { color: '#F2F4F9' } },
          axisLabel: { color: '#999999', fontSize: 10 }
        },
        series: [
          {
            name: '观影数量',
            type: 'bar',
            barWidth: 16,
            data: [3, 5, 2, 6, 4, 3],
            itemStyle: { color: '#5B8FF9', borderRadius: [6, 6, 0, 0] },
            label: { show: true, position: 'top', color: '#666666', fontSize: 10 }
          }
        ]
      });

      window.addEventListener('resize', function () {
        chart.resize();
      });
    </script>
