<!-- 轻提示 -->
<div class="hidden absolute left-1/2 -translate-x-1/2 bottom-32 z-50 px-4 py-2 rounded-full bg-[#333333]/90 text-white text-[13px] whitespace-nowrap" id="toast"></div>
</div>
<script>
      var FILTER_ON = 'f shrink-0 px-3 py-1.5 rounded-full text-[12px] bg-[#5B8FF9] text-white';
      var FILTER_OFF = 'f shrink-0 px-3 py-1.5 rounded-full text-[12px] bg-[#F5F7FB] text-[#666666]';
      var WANT_ON = 'w-[58px] h-7 rounded-full text-[12px] font-medium bg-[#5B8FF9] text-white';
      var WANT_OFF = 'w-[58px] h-7 rounded-full text-[12px] font-medium bg-[#F0F4FF] text-[#5B8FF9]';

      function pickFilter(btn) {
        var items = document.querySelectorAll('.f');
        for (var i = 0; i < items.length; i++) {
          items[i].className = FILTER_OFF;
        }
        btn.className = FILTER_ON;
        refresh();
      }

      function want(e, btn) {
        e.preventDefault();
        e.stopPropagation();
        var on = btn.className.indexOf('bg-[#5B8FF9]') > -1;
        btn.className = on ? WANT_OFF : WANT_ON;
        btn.textContent = on ? '想看' : '已加入';
        toast(on ? '已取消想看' : '已加入待看片单');
        return false;
      }

      function refresh() {
        var list = document.getElementById('rec-list');
        var cards = Array.prototype.slice.call(list.children);
        for (var i = cards.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = cards[i];
          cards[i] = cards[j];
          cards[j] = tmp;
        }
        for (var k = 0; k < cards.length; k++) {
          list.appendChild(cards[k]);
        }
        toast('已按当前条件换一批');
      }

      function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(function () {
          el.classList.add('hidden');
        }, 1600);
      }
    </script>
