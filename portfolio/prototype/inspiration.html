<!-- 轻提示 -->

</div>
<script>
      var MOOD_ON = 'ic w-[52px] h-[52px] rounded-full flex items-center justify-center bg-[#5B8FF9] text-white';
      var MOOD_OFF = 'ic w-[52px] h-[52px] rounded-full flex items-center justify-center bg-[#F0F4FF] text-[#5B8FF9]';
      var SCENE_ON = 'flex flex-col items-center gap-2 py-3 rounded-[14px] border border-[#5B8FF9] bg-[#F0F4FF] active:bg-[#E7EEFE]';
      var SCENE_OFF = 'flex flex-col items-center gap-2 py-3 rounded-[14px] border border-[#EDF0F7] bg-white active:bg-[#F7F9FD]';
      var SCENE_ICON_ON = 'sc w-8 h-8 rounded-full flex items-center justify-center bg-[#5B8FF9] text-white';
      var SCENE_ICON_OFF = 'sc w-8 h-8 rounded-full flex items-center justify-center bg-[#F0F4FF] text-[#5B8FF9]';
      var SCENE_TEXT_ON = 'sn text-[12px] text-[#5B8FF9] font-medium';
      var SCENE_TEXT_OFF = 'sn text-[12px] text-[#666666]';
      var GENRE_ON = 'g px-3.5 py-2 rounded-full text-[12px] bg-[#5B8FF9] text-white';
      var GENRE_OFF = 'g px-3.5 py-2 rounded-full text-[12px] bg-[#F5F7FB] text-[#666666]';

      function toggleMood(btn) {
        var on = btn.dataset.on === '1';
        btn.dataset.on = on ? '0' : '1';
        btn.querySelector('.ic').className = on ? MOOD_OFF : MOOD_ON;
        updateSummary();
      }

      function toggleScene(btn) {
        var items = document.querySelectorAll('[onclick^="toggleScene"]');
        for (var i = 0; i < items.length; i++) {
          if (items[i] !== btn) {
            items[i].dataset.on = '0';
            items[i].className = SCENE_OFF;
            items[i].querySelector('.sc').className = SCENE_ICON_OFF;
            items[i].querySelector('.sn').className = SCENE_TEXT_OFF;
          }
        }
        btn.dataset.on = '1';
        btn.className = SCENE_ON;
        btn.querySelector('.sc').className = SCENE_ICON_ON;
        btn.querySelector('.sn').className = SCENE_TEXT_ON;
        updateSummary();
      }

      function toggleGenre(btn) {
        var on = btn.dataset.on === '1';
        btn.dataset.on = on ? '0' : '1';
        btn.className = on ? GENRE_OFF : GENRE_ON;
        updateSummary();
      }

      function updateSummary() {
        var moods = [];
        var moodBtns = document.querySelectorAll('[onclick^="toggleMood"]');
        for (var i = 0; i < moodBtns.length; i++) {
          if (moodBtns[i].dataset.on === '1') {
            moods.push(moodBtns[i].children[1].textContent.trim());
          }
        }
        var scene = '';
        var sceneBtns = document.querySelectorAll('[onclick^="toggleScene"]');
        for (var j = 0; j < sceneBtns.length; j++) {
          if (sceneBtns[j].dataset.on === '1') {
            scene = sceneBtns[j].querySelector('.sn').textContent.trim();
          }
        }
        var genres = [];
        var genreBtns = document.querySelectorAll('[onclick^="toggleGenre"]');
        for (var k = 0; k < genreBtns.length; k++) {
          if (genreBtns[k].dataset.on === '1') {
            genres.push(genreBtns[k].textContent.trim());
          }
        }
        var text = '已选：';
        text += moods.length ? moods.join(' / ') : '未选择情绪';
        text += ' · ' + (scene || '未选择场景');
        text += ' · ' + (genres.length ? genres.join(' / ') : '未选择类型');
        text += '，将为你匹配 3-5 部电影';
        document.getElementById('summary').textContent = text;
      }

      function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(function () {
          el.classList.add('hidden');
        }, 1600);
      }
    </script>
